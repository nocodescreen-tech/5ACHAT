name: PostgreSQL integration
on:
  push:
    branches: [main, 'feature/v1-android-cloud']
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: achat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: test
      PGDATABASE: achat_test
    steps:
      - uses: actions/checkout@v4
      - run: psql -v ON_ERROR_STOP=1 -f tests/sql/bootstrap.sql -f supabase/migrations/001_initial.sql -f supabase/migrations/002_business_projection.sql -f tests/sql/sync.sql
